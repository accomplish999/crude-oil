name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: pip install -r requirements.txt
      - run: python -m unittest scripts/test_logic.py scripts/test_publish.py
      - run: python scripts/verify.py
      - run: npm ci
      - run: npm run check:guard
      - run: npm run check:dashes
      - run: npm run check:names
      - run: npm run lint
      - run: npm run build
      - run: npm run check:links
